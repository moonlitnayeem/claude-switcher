name: Bug report
description: Report an issue with AI Switcher
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you expected, what you saw, and the steps that triggered it.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AI Switcher version
      description: Find the version in the menu bar dropdown or Finder’s Get Info for the app.
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.5, Apple silicon"
    validations:
      required: true

  - type: textarea
    id: routing
    attributes:
      label: Routing details
      description: >
        For a switching problem, include the model, whether automatic switching was on,
        the primary and backup states under Accounts, and the latest entry in Routing activity.
        Use “primary” and “backup” in place of email addresses.

  - type: dropdown
    id: sharing
    attributes:
      label: Does this involve shared chat history?
      options:
        - Unrelated or unsure
        - Each profile has its own chats
        - A shortcut uses another profile’s chats

  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostic excerpt (optional)
      description: >
        AI Switcher keeps diagnostics.log and state-report.txt under
        ~/Library/Application Support/ClaudeSwitcher/. Paste only lines relevant to the
        issue after redacting names, email addresses, local paths and account, organization
        or session IDs. Keep credentials, Keychain exports and conversation contents private.
      render: text
