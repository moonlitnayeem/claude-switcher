name: Feature request
description: Suggest an improvement to Claude Switcher
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to do?
      description: Describe the task and the result you would expect in the app.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you handle this today?
      description: Include any workaround or repeated steps that the change would simplify.

  - type: textarea
    id: existing-profiles
    attributes:
      label: Impact on existing profiles
      description: For changes to account selection or chat history, explain what should happen to existing profiles and conversations.
