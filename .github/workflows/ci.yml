name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core and routing tests
        run: ./test.sh
      - name: Relay integration tests
        run: ./test-relay.sh
      - name: English and Russian window layout
        run: ./test-layout.sh
      - name: Build for Apple silicon and Intel
        run: SWITCHER_UNIVERSAL=1 ./build.sh
      - name: Verify universal binaries and bundle signature
        run: |
          app='build.noindex/Claude Switcher.app'
          for binary in MacOS/ClaudeSwitcher Resources/graft-launch Resources/graft-relay; do
            lipo "$app/Contents/$binary" -verify_arch arm64 x86_64
          done
          codesign --verify --deep --strict "$app"
